<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radioactivity Lab</title>
<style>
:root{
  /* Lab look: Forces Lab layout, cool lab colours, warm amber action */
  --bg:#0c171e; --surface:#0c171e; --card:#13232c; --card2:#1a2f3a; --line:#24404c; --line2:#305563;
  --text:#eef4f6; --muted:#8fabb6; --link:#7cc2ef;
  --sel:#1d4253; --sel-bd:#56B4E9; --icon:#9fc3d0;
  --amber:#ffc53d; --amber-600:#f5b014; --amber-ink:#3b2a00;
  --orange:#E69F00; --sky:#56B4E9; --green:#009E73; --yellow:#F0E442; --blue:#0072B2; --verm:#D55E00; --purple:#CC79A7; --grey:#C9D3E6;
  --alpha:#E69F00; --beta:#56B4E9; --gamma:#CC79A7;
  --r:16px; font-size:14px;
}
:root.big{font-size:15.5px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.hidden{display:none !important}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}

.top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem;white-space:nowrap;flex:1}
.brand svg{width:26px;height:26px}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--sel-bd)}
.seg button[aria-pressed="true"] svg{color:var(--yellow)}
.seg .chev{display:grid;place-items:center;color:var(--line2);width:10px}
.seg .chev svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.4;fill:none}

.tile{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.tile:hover{background:#21394a;border-color:var(--line2)}
.tile:active{transform:translateY(1px)}
.tile[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-bd);box-shadow:0 0 0 3px rgba(86,180,233,.12)}
.tile svg{width:20px;height:20px;flex:none;stroke:var(--icon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile[aria-pressed="true"] svg{stroke:var(--yellow)}
.tile:disabled{opacity:.45;cursor:not-allowed}

.main{display:grid;grid-template-columns:112px minmax(0,1fr) 330px;gap:12px;padding:12px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.rail{display:flex;flex-direction:column;gap:5px;padding:8px 8px;overflow-y:auto}
.rail .grp{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;margin:4px 0 0;line-height:1.2}
.rail .grp:first-child{margin-top:0}
.rail .tile{flex-direction:column;gap:4px;padding:7px 4px;font-size:.86rem;white-space:normal;text-align:center;line-height:1.2}
.rail .tile svg{width:22px;height:22px}
.rail .tag{font-size:.66rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.rail .spacer{flex:1}
.stage{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.canvas-wrap{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:0 0 var(--r) var(--r)}
.stage-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:var(--r) var(--r) 0 0;position:relative;z-index:5}
.toggles{display:flex;gap:4px;flex:1;min-width:0;align-items:center}
.tool{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 11px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
.tool svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--card2);color:var(--text)}
.tool[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-bd);color:var(--text)}
.tool .n{background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:0 6px;font-size:.8rem;color:var(--text)}
.tool .sh{display:none}
.tsep{width:1px;height:22px;background:var(--line2);margin:0 2px;flex:none}
.play{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--line2);background:var(--card2);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#4a7a8c}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--amber);border-color:var(--amber-600);color:var(--amber-ink);font-weight:750;box-shadow:0 6px 16px rgba(245,176,20,.22)}
.btn.primary:hover{background:var(--amber-600)}
.btn.main{min-width:150px;font-size:1.02rem;padding:9px 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btn.danger{background:transparent;border-color:rgba(213,94,0,.6);color:#f0a073}
.btn.danger:hover{border-color:var(--verm)}
.btn.danger.solid{background:var(--verm);border-color:var(--verm);color:#fff}
.link{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.link .i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--link);display:grid;place-items:center;font-size:.72rem;font-weight:700;font-style:normal}

.panel{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;overflow-x:hidden}
.panel .card{padding:11px 12px}
:root.big .panel{gap:8px}
:root.big .panel .card{padding:9px 11px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl{margin-bottom:9px}
.ctl:last-child{margin-bottom:0}
.ctl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.ctl-row .name{font-weight:600}
.ctl-row .val{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card2);border:1px solid var(--line2);padding:2px 8px;border-radius:7px;min-width:64px;text-align:right}
.ctl .name.solo{display:block;font-weight:600;margin-bottom:5px}
.note{font-size:.84rem;color:var(--muted);margin-top:6px;line-height:1.35}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--fill,#56B4E9) 0,var(--fill,#56B4E9) var(--p,0%),#284553 var(--p,0%),#284553 100%)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#284553}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--fill,#56B4E9)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#eaf3f6;border:3px solid var(--fill,#56B4E9);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#eaf3f6;border:3px solid var(--fill,#56B4E9)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.tiles .tile{gap:6px;padding:8px 4px;font-size:.88rem;justify-content:center}
.tiles.four .tile{font-size:.84rem;gap:5px}
.tiles .dot{width:12px;height:12px;flex:none;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}
.tiles.tall .tile{flex-direction:column;gap:3px;padding:8px 2px;white-space:normal;text-align:center;line-height:1.15}
.tiles.tall .tile small{font-weight:500;color:var(--muted);font-size:.74rem}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card2);cursor:pointer;font-weight:700;font-size:1.1rem;line-height:1}
.stepper button:hover{border-color:var(--sel-bd)}
.stepper input{width:70px;height:34px;border-radius:9px;border:1.5px solid var(--line2);background:var(--bg);color:var(--text);font:inherit;font-weight:700;font-size:1.05rem;text-align:center;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;border-color:var(--amber)}
.guess{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px}
.guess .name{font-weight:600}

.readouts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:6px}
.ro{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:6px 7px;min-width:0}
.ro .k{font-size:.74rem;color:var(--muted);line-height:1.15}
.ro .v{font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.why h3{margin:0 0 6px;font-size:1rem}
.why p{margin:0 0 7px;line-height:1.42;color:#d3e0e5}
.why p:last-child{margin-bottom:0}
.why .def{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0 0 8px;line-height:1.38;font-size:.9rem}
.why .def b{color:var(--yellow)}
.why .links{display:flex;gap:14px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);flex-wrap:wrap}
.why .tagline{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--link);margin:0 0 4px}

.task .q{margin:0 0 10px;line-height:1.45}
.task .opts{display:grid;grid-template-columns:1fr;gap:6px}
.task .opts .tile{white-space:normal;text-align:left;justify-content:flex-start;padding:8px 12px;font-weight:600;line-height:1.3}
.task .opts.two{grid-template-columns:1fr 1fr}
.task .opts.three{grid-template-columns:1fr 1fr 1fr}
.task .opts.two .tile,.task .opts.three .tile{justify-content:center;text-align:center}
.tile.right{border-color:var(--sky);background:rgba(86,180,233,.16)}
.tile.wrong{border-color:var(--orange);background:rgba(230,159,0,.14);animation:shake .3s}
.fb{border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.4;font-size:.92rem}
.fb.ok{background:rgba(86,180,233,.13);border:1.5px solid var(--sky)}
.fb.no{background:rgba(230,159,0,.12);border:1.5px solid var(--orange)}
.fb b{display:block;margin-bottom:2px}
.task .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.task .foot span{color:var(--muted);font-size:.86rem}
.clues{display:grid;grid-template-columns:1fr;gap:6px}
.clues .tile{white-space:normal;text-align:left;line-height:1.25}
.clues .tile small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.ans .tile{flex-direction:column;gap:2px;padding:8px 2px}
.ans .tile b{font-size:1.15rem}
.ans .tile.a{background:rgba(230,159,0,.10);border-color:rgba(230,159,0,.45)}
.ans .tile.b{background:rgba(86,180,233,.10);border-color:rgba(86,180,233,.45)}
.ans .tile.g{background:rgba(204,121,167,.12);border-color:rgba(204,121,167,.5)}
.ans .tile:hover{filter:brightness(1.2)}

.pop{position:absolute;right:16px;bottom:16px;width:min(340px,calc(100% - 32px));background:var(--card);border:1.5px solid var(--sel-bd);border-radius:14px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:6;animation:popin .25s ease-out}
.pop .tagline{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--link);margin:0 0 4px}
.pop h3{margin:0 0 6px;font-size:1.08rem}
.pop p{margin:0 0 10px;line-height:1.42;color:#d3e0e5;font-size:.94rem}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pop .row span{font-size:.82rem;color:var(--muted)}

.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,10,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;padding:16px}
.modal .box{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .box.sm{width:min(440px,100%)}
.modal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.modal h2{margin:0;font-size:1.2rem}
.modal .x{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card2);cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.modal p{line-height:1.5;color:#d3e0e5;margin:0 0 10px}
.modal dt{font-weight:700;margin-top:12px}
.modal dd{margin:4px 0 0;line-height:1.5;color:#d3e0e5}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
table.res th{text-align:left;color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.res td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.fvtab th,table.fvtab td{font-size:.78rem;padding:4px 5px;line-height:1.25;vertical-align:top}table.fvtab td:first-child{color:var(--muted);font-weight:700;white-space:nowrap}
table.res td.num,table.res th.num{text-align:right}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.bars{display:grid;grid-template-columns:240px 1fr 44px;gap:8px 10px;align-items:center}
.bars .bar{height:16px;border-radius:4px;background:var(--sky)}
.bars .pc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:1400px){ .tool .lg{display:none} .tool .sh{display:inline} }
@media (max-width:1180px){ #resetBtn .rl{display:none} #resetBtn{padding:9px 11px} .panel{gap:8px} .panel .card{padding:10px 11px} .why .def,.why p{font-size:.88rem;line-height:1.36} .main{grid-template-columns:100px minmax(0,1fr) 300px} .tool{padding:0 8px} .btn.main{min-width:120px} }
/* ---- v3: richer frame ---- */
body{background:
  radial-gradient(1200px 500px at 15% -10%, rgba(255,197,61,.10), transparent 60%),
  radial-gradient(900px 600px at 110% 110%, rgba(86,180,233,.10), transparent 60%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 28px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 28px),
  var(--bg)}
.top{background:transparent}
.card{background:linear-gradient(180deg, #16293300, #16293300), var(--card); box-shadow:0 8px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04)}
.stage-bar{background:linear-gradient(180deg,#132630,#0f1f27)}
/* bigger, clearer pop-ups */
.pop{width:min(440px,calc(100% - 32px));padding:18px 20px;border-width:2px;border-radius:16px}
.pop .tagline{font-size:.8rem}
.pop h3{font-size:1.3rem;margin-bottom:8px}
.pop p{font-size:1.05rem;line-height:1.5}
.pop .eqn{font-size:1.15rem;font-weight:700;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;margin:0 0 12px;display:inline-block}
.pop .steps{font-size:.85rem;color:var(--muted);font-weight:700}
.pop .btns{display:flex;gap:8px}
/* check bar */
.checkbar{position:relative;z-index:4;display:flex;flex-direction:column;gap:9px;padding:13px 18px 14px;min-height:196px;max-height:320px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,#1a3340,#142833);overflow:auto;flex:none}
.checkbar .cb-top{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.checkbar .cb-top .tagq{color:var(--yellow)}
.checkbar .cb-q{font-size:1.22rem;font-weight:700;line-height:1.35;color:var(--text)}
.checkbar .cb-q small{display:block;font-size:.9rem;font-weight:500;color:#c5d6dc;margin-top:3px}
.checkbar .cb-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.checkbar .cb-opts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;flex:1}
.checkbar .cb-opts .tile{justify-content:center;text-align:center;white-space:normal;line-height:1.2;padding:10px 8px;font-size:1rem;font-weight:700;min-height:46px}
.checkbar .cb-num{display:flex;align-items:center;gap:8px}
.checkbar .cb-num label{font-weight:700}
.checkbar .cb-num input{width:110px;height:44px;border-radius:10px;border:2px solid var(--line2);background:var(--bg);color:var(--text);font:inherit;font-weight:800;font-size:1.2rem;text-align:center}
.checkbar .cb-num input:focus{outline:none;border-color:var(--amber)}
.checkbar .cb-num .unit{color:var(--muted);font-weight:700}
.checkbar .cb-fb{flex:1;font-size:.98rem;line-height:1.35;padding:8px 12px;border-radius:10px;min-height:42px;display:flex;align-items:center}
.checkbar .cb-fb.ok{background:rgba(86,180,233,.15);border:1.5px solid var(--sky)}
.checkbar .cb-fb.no{background:rgba(230,159,0,.13);border:1.5px solid var(--orange)}
.checkbar .cb-fb.goal{background:rgba(240,228,66,.08);border:1.5px dashed rgba(240,228,66,.6)}
.checkbar .cb-fb.plain{color:var(--muted)}
.checkbar .btn{padding:11px 18px;font-size:1rem}
.progress .big{font-size:1.5rem;font-weight:800}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress .sub{color:var(--muted);font-size:.86rem;line-height:1.35;margin-top:6px}
.progress .btn{margin-top:10px}
/* bold controls (chain reaction) */
.bigctl .ctl-row .name{font-size:1.05rem;font-weight:750}
.bigctl .ctl-row .val{font-size:1.1rem;padding:3px 10px}
input[type=range].big{height:40px}
input[type=range].big::-webkit-slider-runnable-track{height:14px;border-radius:7px}
input[type=range].big::-webkit-slider-thumb{width:34px;height:34px;margin-top:-10px;border-width:4px}
input[type=range].big::-moz-range-track{height:14px;border-radius:7px}
input[type=range].big::-moz-range-progress{height:14px;border-radius:7px}
input[type=range].big::-moz-range-thumb{width:28px;height:28px;border-width:4px}
.ends{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:-2px}
.steprow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.steprow .btn{padding:9px 4px;font-weight:750}
.tiles.huge .tile{flex-direction:column;gap:4px;padding:11px 4px;font-size:.98rem;font-weight:750}
.tiles.huge .tile svg{width:24px;height:24px}
.tiles.huge .tile small{font-size:.74rem;font-weight:600;color:var(--muted);white-space:normal;text-align:center;line-height:1.15}
.btn.big{padding:12px 14px;font-size:1.02rem;font-weight:750}
.decay-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.decay-btns .tile{flex-direction:column;gap:2px;padding:9px 2px;font-size:.86rem}
.decay-btns .tile b{font-size:1.3rem}
.hist{font-size:.84rem;color:var(--muted);line-height:1.5}
.walk .k{font-weight:800;color:var(--yellow)}
select.sel{width:100%;height:40px;background:#0d1d24;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:0 10px;font:600 .95rem var(--font,inherit);cursor:pointer}
select.sel:focus{outline:2px solid var(--amber,#ffc53d);outline-offset:1px}
.tiles.grid2{grid-template-columns:1fr 1fr}
.tiles.grid2 .tile{white-space:normal;text-align:center;line-height:1.15}

/* ===== v4: Lab hardware controls ===== */
:root{--key-top:#3a5866;--key-bot:#243d48;--key-bd:#4b6a77;--key-edge:#0a1418;--lamp-off:#0b1418}
/* every pressable thing is a raised key */
.tile,.btn,.tool,.stepper button,.seg button{
  background:linear-gradient(180deg,var(--key-top),var(--key-bot));border:2px solid var(--key-bd);color:var(--text);
  box-shadow:0 4px 0 var(--key-edge),0 6px 10px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.tile:hover,.btn:hover,.tool:hover,.stepper button:hover,.seg button:hover{background:linear-gradient(180deg,#44677a,#2a4655);border-color:#6a8d9b;color:var(--text)}
.tile:active,.btn:active,.tool:active,.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--key-edge),0 2px 4px rgba(0,0,0,.3)}
.tile svg,.tool svg{stroke:#cfe0e6}
/* chosen / switched on: the key sinks in, its lamp lights, text turns amber */
.tile[aria-pressed="true"],.tool[aria-pressed="true"],.seg button[aria-pressed="true"]{
  transform:translateY(3px);background:linear-gradient(180deg,#16262e,#1d3442);border-color:var(--amber);color:var(--amber);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 var(--key-edge)}
.tile[aria-pressed="true"] svg,.tool[aria-pressed="true"] svg,.seg button[aria-pressed="true"] svg{stroke:var(--amber);color:var(--amber)}
/* lamps on every on/off or pick-one key */
.tile[aria-pressed]::before,.tool[aria-pressed]::before,.seg button[aria-pressed]::before{content:"";width:11px;height:11px;border-radius:50%;flex:none;background:var(--lamp-off);border:2px solid #56707b}
.tile[aria-pressed="true"]::before,.tool[aria-pressed="true"]::before,.seg button[aria-pressed="true"]::before{background:var(--amber);border-color:#ffe39a;box-shadow:0 0 9px var(--amber)}
.tiles.tall .tile,.tiles.huge .tile,.decay-btns .tile,.rail .tile{position:relative}
.tiles.tall .tile[aria-pressed]::before,.tiles.huge .tile[aria-pressed]::before,.decay-btns .tile[aria-pressed]::before,.rail .tile[aria-pressed]::before{position:absolute;top:7px;left:7px;width:10px;height:10px}
.tile:disabled,.btn:disabled{opacity:.4;transform:none;box-shadow:none}
.tile:disabled:active{transform:none}
/* main action keys: chunky amber */
.btn.primary{background:linear-gradient(180deg,#ffd466,#e6a91c);border:2px solid #1a1300;color:#1a1300;font-weight:800;box-shadow:0 5px 0 #7a5600,0 8px 14px rgba(0,0,0,.4)}
.btn.primary:hover{background:linear-gradient(180deg,#ffdc80,#f0b52a);border-color:#1a1300;color:#1a1300}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #7a5600}
.btn.danger{background:transparent;box-shadow:none}
.btn.danger.solid{background:var(--verm);box-shadow:0 4px 0 #6b2f00}
/* mode switch and stage bar sit on a dark recessed strip */
.seg{background:#0a1418;border:2px solid var(--line2);box-shadow:inset 0 2px 6px rgba(0,0,0,.5);padding:5px;gap:6px}
.seg button{padding:7px 14px;color:var(--text)}
.seg .chev{display:none}
.stage-bar{gap:8px;padding:9px 10px 12px}
.toggles{gap:8px}
.tool{height:38px;padding:0 12px}
.tool .n{background:#0a1418;border-color:var(--key-bd)}
.tsep{display:none}
.rail{gap:9px;padding:10px 9px}
.rail .tile{padding:8px 4px 7px}
/* panel cards look like labelled metal plates */
.panel .card,.rail.card,.stage.card{background:linear-gradient(180deg,#1f323b,#16252d);border:2px solid #34505c;box-shadow:inset 0 1px 0 #4d6a76,0 8px 24px rgba(0,0,0,.25)}
.ctl .name.solo,.ctl-row .name{font-weight:750}
.tiles{gap:8px}
.tiles .tile{padding:9px 4px}
.ctl-row .val{background:#0a1418;border:2px solid var(--line2);color:var(--amber);font-size:1.02rem}
/* sliders become levers in a groove */
input[type=range]{height:34px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--fill,#56B4E9) 0,var(--fill,#56B4E9) var(--p,0%),#0a1418 var(--p,0%),#0a1418 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,.7);border:1px solid #34505c}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:#0a1418;border:1px solid #34505c}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--fill,#56B4E9)}
input[type=range]::-webkit-slider-thumb{width:24px;height:30px;border-radius:6px;background:linear-gradient(180deg,#ffd466,#e6a91c);border:2px solid #1a1300;margin-top:-11px;box-shadow:0 3px 0 #7a5600,0 4px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:26px;border-radius:6px;background:linear-gradient(180deg,#ffd466,#e6a91c);border:2px solid #1a1300}
input[type=range].big{height:46px}
input[type=range].big::-webkit-slider-runnable-track{height:16px;border-radius:8px}
input[type=range].big::-webkit-slider-thumb{width:32px;height:40px;margin-top:-14px;border-width:2px;border-radius:7px}
input[type=range].big::-moz-range-thumb{width:28px;height:36px;border-width:2px;border-radius:7px}
.ends{color:#b9c9cf}
/* typed number boxes */
.stepper input,.checkbar .cb-num input{background:#0a1418;border:2px solid var(--key-bd);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
/* Check answers: right / wrong keys */
.tile.right{border-color:var(--sky);background:linear-gradient(180deg,#2a5a73,#1d4458);color:#fff;transform:translateY(3px);box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
.tile.wrong{border-color:var(--orange);background:linear-gradient(180deg,#4a3a12,#3a2c0c);color:#ffd27a;opacity:.75}
.tile.right::after{content:"✓";font-weight:900;margin-left:4px}
.tile.wrong::after{content:"✗";font-weight:900;margin-left:4px}
.tile.right:disabled{opacity:1}
.tile.wrong:disabled{opacity:.6}
.checkbar .cb-fb.hint{background:rgba(240,228,66,.08);border:1.5px solid rgba(240,228,66,.55)}
.stepper input{width:96px;height:42px;font-size:1.15rem}
/* v4 compact fit: the lamp replaces the icon on small switches */
.tool[aria-pressed] svg,.tiles:not(.huge):not(.tall) .tile[aria-pressed] svg{display:none}
.tool{padding:0 10px;gap:7px}
.tiles.huge .tile,.tiles.tall .tile{padding-left:20px;padding-right:20px}
.panel{gap:8px}
.panel .card{padding:9px 12px}
.tile:has(.dot)::before{display:none}
.tile[aria-pressed="true"] .dot{box-shadow:0 0 0 3px #0d1a21,0 0 0 5px var(--amber),0 0 12px var(--amber)}
.tiles .dot{width:13px;height:13px}
.ctl{margin-bottom:8px}
.tiles .tile{padding:7px 4px}
.ctl .name.solo{margin-bottom:6px}
.progress .btn{margin-top:8px}
/* ===== v4: big centre card in Check ===== */
.cpop{position:absolute;inset:0;z-index:7;display:grid;place-items:center;padding:12px;background:rgba(4,10,14,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadein .15s ease-out}
.cc{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--card);border:4px solid var(--sky);border-radius:20px;padding:18px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:ccin .28s cubic-bezier(.2,1.4,.4,1)}
.cc.no{border-color:var(--orange)}
.cc .ci{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--sky);flex:none}
.cc.no .ci{background:var(--orange);border-radius:14px}
.cc .ci svg{width:36px;height:36px;fill:none;stroke:#0d1a21;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.cc .ct{font-size:2rem;font-weight:900;line-height:1.1}
.cc .cx{font-size:1.05rem;line-height:1.45;color:#d3e0e5}
.cc .cs{font-size:.92rem;font-weight:800;color:var(--sky)}
.cc .cbtns{display:flex;gap:10px;align-self:stretch;margin-top:4px}
.cc .cbtns .btn{flex:1;padding:12px 14px;font-size:1.05rem}
@keyframes ccin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ===== v5: what to do now ===== */
.donow{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,#2a2410,#1f1b0c);border-bottom:2px solid rgba(255,197,61,.55);font-size:1.12rem;font-weight:750;color:#fff3cf;line-height:1.3;flex:none;position:relative;z-index:4}
.donow .dl{width:14px;height:14px;border-radius:50%;flex:none;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 2px var(--amber);opacity:.7}}
/* ===== v5: big note card over the stage ===== */
.pop.note{inset:0;right:0;bottom:0;width:auto;background:rgba(4,10,14,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:0;border-radius:0;padding:14px;box-shadow:none;display:grid;place-items:center;animation:fadein .15s ease-out}
.pop.note .pbox{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border:4px solid var(--sky);border-radius:20px;padding:20px 24px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:ccin .28s cubic-bezier(.2,1.4,.4,1)}
.pop.note .pbox.ok{border-color:var(--sky)}
.pop.note .pbox.no{border-color:var(--orange)}
.pop.note .pbox.info{border-color:var(--amber)}
.pop.note .phead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.pop.note .pi{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--amber)}
.pop.note .ok .pi{background:var(--sky)}
.pop.note .no .pi{background:var(--orange);border-radius:12px}
.pop.note .pi svg{width:30px;height:30px;fill:none;stroke:#0d1a21;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.pop.note .tagline{display:block;font-size:.85rem;color:var(--amber);margin:0 0 2px}
.pop.note .ok .tagline{color:var(--sky)}
.pop.note .no .tagline{color:var(--orange)}
.pop.note h3{color:#fff;margin:0;font-size:1.6rem;font-weight:850;line-height:1.15}
.pop.note p{font-size:1.15rem;line-height:1.5;color:#e2ecef;margin:0 0 14px}
.pop.note .row .btn{padding:12px 22px;font-size:1.05rem}
.pop.walk{border-width:3px;border-color:var(--amber)}
/* ===== v5: big answer boxes ===== */
.ansbig{display:grid;gap:8px}
.ansbig .tile,.ansbig.one{display:flex;align-items:center;gap:14px;justify-content:flex-start;text-align:left;white-space:normal;padding:10px 14px;min-height:62px}
.ansbig b{font-size:1.9rem;width:34px;text-align:center;flex:none;line-height:1}
.ansbig .an{display:block;font-size:1.15rem;font-weight:850}
.ansbig .ad{display:block;font-size:.92rem;font-weight:600;color:#c5d6dc}
.ansbig .tile.a b,.ansbig.one.a b{color:var(--alpha)} .ansbig .tile.b b,.ansbig.one.b b{color:var(--beta)} .ansbig .tile.g b,.ansbig.one.g b{color:var(--gamma)}
.ansbig.one{border-radius:12px;border:3px solid var(--amber);background:linear-gradient(180deg,#2c2712,#211d0e)}
.ansbig .tile.right .ad,.ansbig .tile.right .an{color:#fff}
.found{display:flex;flex-direction:column;gap:6px}
.found div{display:flex;flex-direction:column;background:#0a1418;border:2px solid #34505c;border-left:5px solid var(--amber);border-radius:10px;padding:7px 11px}
.found span{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.found b{font-size:1.1rem;font-weight:800}

/* ===== v6a: fewer words, one glowing next step ===== */
.glow{animation:glowring 1.3s ease-in-out infinite !important;position:relative;z-index:2}
@keyframes glowring{0%,100%{box-shadow:0 0 0 3px rgba(255,197,61,.95),0 0 18px 6px rgba(255,197,61,.55)}50%{box-shadow:0 0 0 3px rgba(255,197,61,.35),0 0 4px 1px rgba(255,197,61,.2)}}
.btn.primary.glow{animation:glowring 1.3s ease-in-out infinite !important}
.donow{padding:7px 14px;font-size:1.02rem;gap:10px}
.donow .dl{width:11px;height:11px}
.rail .rsep{height:1px;background:var(--line2);margin:3px 6px}
.rail .tile{padding:9px 4px 8px}
#soundBtn,#teacherBtn{width:44px;padding:0;justify-content:center}
#soundBtn::before,#teacherBtn::before{position:absolute;top:4px;left:4px;width:8px;height:8px}
#soundBtn,#teacherBtn{position:relative}

.panel .note{display:none}
.panel .note.keep{display:block}
.why .more{display:none}
.why.open .more{display:block}
.why .morebtn{margin-top:6px}

.checkbar{min-height:0}
.checkbar .cb-sc{display:flex;align-items:center;gap:10px}
.checkbar .cb-sc .dots{display:flex;gap:4px}
.checkbar .cb-sc .dots i{width:10px;height:10px;border-radius:50%;background:#0a1418;border:1.5px solid #4b6a77}
.checkbar .cb-sc .dots i.y{background:var(--sky);border-color:var(--sky)}
.checkbar .cb-sc .dots i.n{background:var(--orange);border-color:var(--orange);border-radius:2px}

.checkbar .cb-new{height:32px;width:36px;padding:0;justify-content:center}

#soundBtn svg,#teacherBtn svg{display:block !important;width:20px;height:20px}
#soundBtn::before,#teacherBtn::before{display:none}
.tiles.five .tile{font-size:1.25rem;font-weight:800;padding:6px 2px}
.tiles.five .tile[aria-pressed]::before{position:absolute;top:4px;left:4px;width:7px;height:7px;border-width:1.5px}
.tiles.five .tile{font-size:1.05rem;min-width:0}
.ansbig.tabs .tile[aria-pressed="true"]{border:3px solid var(--amber);background:linear-gradient(180deg,#2c2712,#211d0e)}
.ansbig.tabs .tile[aria-pressed="true"] .an{color:var(--amber)}
.ansbig .tile[aria-pressed]::before{position:absolute;top:8px;right:8px;left:auto}
.ansbig .tile{position:relative}
.why h3{font-size:1.05rem}
.tile .sym{font-size:1.3rem;line-height:1}
.wide-key{width:100%;justify-content:flex-start;padding:10px 14px;font-size:1rem}

/* ===== v7 ===== */
/* 47: chosen keys light a blue LED; the "press this next" glow is bright yellow */
:root{--led:#56B4E9;--next:#F0E442}
.tile[aria-pressed="true"],.tool[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--led);color:#d7efff;background:linear-gradient(180deg,#132634,#183447)}
.tile[aria-pressed="true"] svg,.tool[aria-pressed="true"] svg,.seg button[aria-pressed="true"] svg{stroke:var(--led);color:var(--led)}
.tile[aria-pressed="true"]::before,.tool[aria-pressed="true"]::before,.seg button[aria-pressed="true"]::before{background:var(--led);border-color:#c9ecff;box-shadow:0 0 9px var(--led),0 0 3px #fff inset}
.tile[aria-pressed="true"] .dot{box-shadow:0 0 0 3px #0d1a21,0 0 0 5px var(--led),0 0 12px var(--led)}
.ansbig.tabs .tile[aria-pressed="true"]{border:3px solid var(--led);background:linear-gradient(180deg,#132634,#183447)}
.ansbig.tabs .tile[aria-pressed="true"] .an{color:#d7efff}
@keyframes glowring{0%,100%{box-shadow:0 0 0 3px rgba(240,228,66,1),0 0 20px 7px rgba(240,228,66,.6)}50%{box-shadow:0 0 0 3px rgba(240,228,66,.4),0 0 5px 1px rgba(240,228,66,.25)}}
/* learn bar */

.learnbar .lb-btns{display:flex;gap:8px;margin-left:auto}.learnbar .lb-btns .btn{min-height:38px;padding:6px 14px;font-size:.92rem}

.lk{opacity:.32!important;pointer-events:none!important;filter:grayscale(.6)}

.learnbar .cb-sc{display:flex;align-items:center;gap:10px}

body.lb-wait #controlsCard,body.lb-wait #toggles,body.lb-wait #playBtn,body.lb-wait #resetBtn{pointer-events:none;opacity:.4}
.pn-box{display:flex;flex-direction:column;gap:10px}

/* ===== v11 ===== */
/* 94: Explore / Learn / Check as big folder tabs, top middle */
.top{flex-wrap:wrap;row-gap:2px;padding-bottom:0}

<script>
"use strict";
/* ===== Radioactivity Lab: core ===== */
const $ = s => document.querySelector(s);
const FONT = 'Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
const C = {orange:'#E69F00', sky:'#56B4E9', green:'#009E73', yellow:'#F0E442', blue:'#0072B2', verm:'#D55E00', purple:'#CC79A7', grey:'#C9D3E6',
  text:'#eef4f6', muted:'#8fabb6', alpha:'#E69F00', beta:'#56B4E9', gamma:'#CC79A7', proton:'#D55E00', neutron:'#C9D3E6', amber:'#ffc53d'};
const RAD = {alpha:{name:'Alpha', sym:'α', c:C.alpha}, beta:{name:'Beta', sym:'β', c:C.beta}, gamma:{name:'Gamma', sym:'γ', c:C.gamma}, neutron:{name:'Neutron', sym:'n', c:C.neutron}};
const I = { // 20x20 line icons
  back:'<path d="M12.5 4.5 7 10l5.5 5.5"/>',
  reset:'<path d="M3.5 10a6.5 6.5 0 1 0 2-4.7"/><path d="M3.5 3v3.5H7"/>',

  undo:'<path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/>',

  book:'<path d="M3 4.5c2.5-1 4.5-1 7 .5v11c-2.5-1.5-4.5-1.5-7-.5zM17 4.5c-2.5-1-4.5-1-7 .5v11c2.5-1.5 4.5-1.5 7-.5z"/>',
  check:'<circle cx="10" cy="10" r="7.5"/><path d="M6.6 10.2l2.3 2.3 4.6-4.8"/>',
  curve:'<path d="M3 3v14h14"/><path d="M5.5 5c2 6 5 9.5 10.5 10"/>',
  eq:'<path d="M2.5 10h8M7.5 6.5l3.5 3.5-3.5 3.5"/><circle cx="15.5" cy="10" r="2.5"/>',
  mystery:'<circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.8a2.3 2.3 0 1 1 3 2.2c-.5.2-.8.6-.8 1.1v.6"/><path d="M10 14.4v.2"/>',
  geiger:'<path d="M2.5 10h3.5"/><path d="M8 4v12M11.5 4v12"/><rect x="14" y="7" width="4" height="6" rx="1"/>',
  split:'<circle cx="5.5" cy="10" r="2.6"/><circle cx="14.5" cy="5" r="2.2"/><circle cx="14.5" cy="15" r="2.2"/><path d="M8.2 8.8l3.8-2.4M8.2 11.2l3.8 2.4"/>',
  star:'<circle cx="10" cy="10" r="3.6"/><path d="M10 2v2.4M10 15.6V18M2 10h2.4M15.6 10H18M4.3 4.3l1.7 1.7M14 14l1.7 1.7M4.3 15.7L6 14M14 6l1.7-1.7"/>',
  play:'<path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/>',
  pause:'<path d="M5.5 3.5v9M10.5 3.5v9"/>',
  sound:'<path d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.3 5a7 7 0 0 1 0 10"/>',
  mute:'<path d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13.5 8l4 4M17.5 8l-4 4"/>',
  table:'<rect x="3" y="4" width="14" height="12" rx="1.5"/><path d="M3 8h14M3 12h14M8 4v12"/>',
  info:'<circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.3v.2"/>',
  eye:'<path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.4"/>',
  target:'<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.5"/>',
  lines:'<path d="M3 3v14h14"/><path d="M3 10h7v7" stroke-dasharray="2 2"/>',
  ghost:'<path d="M3 16c3-9 6-11 14-12"/><path d="M3 12c3-5 6-6 9-6" opacity=".5"/>',
  bolt:'<path d="M11 2.5L4.5 11h5L9 17.5 15.5 9h-5z"/>',
  graph:'<path d="M3 3v14h14"/><path d="M6 13l3-4 3 2 4-6"/>',
  rods:'<path d="M6 3v10M10 3v6M14 3v12"/><path d="M3 17h14"/>',
  speed:'<path d="M3.5 13.5a7 7 0 1 1 13 0"/><path d="M10 11l3.5-3.5"/>',
  wave:'<path d="M2 10c1.5-4 3-4 4 0s2.5 4 4 0 2.5-4 4 0 2.5 4 4 0"/>',
};
const ic = (k, extra='') => `<svg viewBox="0 0 20 20" ${extra}>${I[k]}</svg>`;
const app = {mode:'explore', sim:null, playing:false, sound:true, big:false, dbl:false, seen:{}, quiz:{}, popOpen:false};
const SIMS = [];
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = (v, d=0) => Number(v).toLocaleString('en-GB', {minimumFractionDigits:d, maximumFractionDigits:d});
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem('radlab.'+k)); localStorage.setItem('radlab.'+k, JSON.stringify(v)); }catch(e){ return null; } }

/* ----- canvas ----- */
const cv = $('#stage'); let ctx = cv.getContext('2d');
let W = 800, H = 520, DPR = 1;
function resize(){ if(!app.sim) return;
  const r = $('#wrap').getBoundingClientRect(); DPR = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width*DPR)); cv.height = Math.max(1, Math.round(r.height*DPR));
  W = r.width; H = r.height; ctx.setTransform(DPR,0,0,DPR,0,0);
  if(app.sim && app.sim.resize) app.sim.resize();
  const q = curQ(); if(q && q.kind === 'board') q.fig(); else app.sim.draw();
}
function rr(x,y,w,h,r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s, x, y, o={}){
  ctx.save(); ctx.font = `${o.w||600} ${o.size||14}px ${FONT}`; ctx.fillStyle = o.color||C.text; ctx.textAlign = o.align||'left'; ctx.textBaseline = o.base||'middle';
  if(o.alpha!=null) ctx.globalAlpha = o.alpha; ctx.fillText(s, x, y); const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function tw(s, size=14, w=600){ ctx.save(); ctx.font = `${w} ${size}px ${FONT}`; const m = ctx.measureText(s).width; ctx.restore(); return m; }
function pill(s, x, y, o={}){
  const size = Math.round((o.size||13)*1.12), pad = o.pad||9, // v18 (item 180): stage labels a little bigger
   w = tw(s, size, o.w||650) + pad*2, h = size + 12;
  const left = o.align==='center' ? x - w/2 : o.align==='right' ? x - w : x;
  ctx.save(); rr(left, y - h/2, w, h, o.r||8); ctx.fillStyle = o.bg||'rgba(8,16,22,.86)'; ctx.fill();
  if(o.border){ ctx.strokeStyle = o.border; ctx.lineWidth = 1.5; ctx.stroke(); }
  if(o.bar){ ctx.fillStyle = o.bar; rr(left+4, y-h/2+5, 3, h-10, 1.5); ctx.fill(); }
  ctx.restore(); txt(s, left + pad + (o.bar?4:0), y+.5, {size, w:o.w||650, color:o.color||C.text}); return w;
}
function dot(x,y,r,fill,stroke,lw=1.5){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ ctx.fillStyle = fill; ctx.fill(); } if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function ball(x,y,r,c){ // shaded sphere
  const g = ctx.createRadialGradient(x-r*.35, y-r*.4, r*.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.25, c); g.addColorStop(1, shade(c, -.45));
  dot(x,y,r,g,'rgba(0,0,0,.35)',1);
}
function shade(hex, f){ const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const t = f<0 ? 0 : 255, p = Math.abs(f); r = Math.round((t-r)*p+r); g = Math.round((t-g)*p+g); b = Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
/* nuclear notation: mass number on top, atomic number below, symbol to the right. Returns width. */
function nuc(x, y, A, Z, sym, o={}){
  const s = o.size||30, small = Math.round(s*.52), c = o.color||C.text, sc = o.numColor||c;
  const wa = tw(String(A), small, 700), wz = tw(String(Z), small, 700), wn = Math.max(wa, wz);
  let px = x; if(o.align==='center'){ px = x - (wn + 3 + tw(sym, s, 700))/2; }
  txt(String(A), px + wn, y - s*.36, {size:small, w:700, color:o.aColor||sc, align:'right'});
  txt(String(Z), px + wn, y + s*.36, {size:small, w:700, color:o.zColor||sc, align:'right'});
  const ws = txt(sym, px + wn + 3, y, {size:s, w:700, color:c});
  return wn + 3 + ws;
}
function nucW(A, Z, sym, s){ const small = Math.round(s*.52); return Math.max(tw(String(A), small, 700), tw(String(Z), small, 700)) + 3 + tw(sym, s, 700); }

/* ----- lab scenery (v3: richer, cached) ----- */
const SCN = {};
function cached(key, fn){
  const k = key + '|' + W + 'x' + H + '|' + DPR;
  let c = SCN[key];
  if(!c || c.k !== k){ c = SCN[key] = {k, cv:document.createElement('canvas')}; c.cv.width = Math.max(1, Math.round(W*DPR)); c.cv.height = Math.max(1, Math.round(H*DPR));
    const old = ctx; ctx = c.cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0); try{ fn(); } finally { ctx = old; } }
  ctx.drawImage(c.cv, 0, 0, W, H);
}
function drawLab(benchY, o={}){
  cached('lab:' + benchY + ':' + JSON.stringify(o), () => labScene(benchY, o));
  motes(benchY);
}
function labScene(benchY, o){
  const g = ctx.createLinearGradient(0,0,0,benchY); g.addColorStop(0,'#21404c'); g.addColorStop(1,'#152c36');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,benchY);
  // tiles, some slightly lighter for a hand-made feel
  let row = 0; for(let y = benchY; y > 0; y -= 34, row++) for(let x = (row%2)*-34; x < W; x += 68){
    const h = ((x*13 + y*7) % 11)/11; ctx.fillStyle = `rgba(255,255,255,${.008 + h*.022})`; ctx.fillRect(x+1, y-33, 66, 32); }
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.beginPath();
  for(let y = benchY - 34; y > 0; y -= 34){ ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); } row = 0;
  for(let y = benchY; y > 0; y -= 34, row++) for(let x = (row%2)*-34; x < W; x += 68){ ctx.moveTo(x+.5,y); ctx.lineTo(x+.5,y-34); } ctx.stroke();
  const deco = o.deco || defaultDeco(benchY);
  for(const d of deco) decoItem(d, benchY);
  if(o.shelf) shelf(o.shelf.x, o.shelf.y, o.shelf.w);
  if(o.sign) trefoilSign(o.sign.x, o.sign.y, o.sign.s||26);
  // ceiling pipes and warm lamps
  if(o.pipes) pipes(); // v18 (item 173): the pipe bar along the top is gone
  for(const lx of (o.lamps || [W*.22, W*.78])) lamp(lx, benchY);
  // bench with cabinet doors
  const bg = ctx.createLinearGradient(0,benchY,0,benchY+14); bg.addColorStop(0,'#9a7350'); bg.addColorStop(1,'#64492f');
  ctx.fillStyle = '#2b221c'; ctx.fillRect(0, benchY, W, H-benchY);
  if(H - benchY > 40){ const dh = H - benchY - 24, n = Math.max(2, Math.round(W/170)), dw = W/n;
    for(let k=0;k<n;k++){ const x = k*dw + 8; rr(x, benchY+18, dw-16, dh, 6); ctx.fillStyle = '#33281f'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#9aa5ab'; rr(x + (k%2 ? 12 : dw-40), benchY + 18 + Math.min(26, dh/2), 16, 4, 2); ctx.fill(); } }
  ctx.fillStyle = bg; ctx.fillRect(0, benchY, W, 12);
  ctx.fillStyle = 'rgba(255,230,190,.3)'; ctx.fillRect(0, benchY, W, 1.5);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(0, benchY+12, W, 4);
  for(const b of (o.bench || [])) benchItem(b, benchY);
  // soft vignette
  const v = ctx.createRadialGradient(W/2, H*.45, Math.min(W,H)*.35, W/2, H*.45, Math.max(W,H)*.8);

const LASTSET = {};

function makeSet(templates, n=10, minSim=4){ const all = [], key = (app.sim && app.sim.id) || '?', last = LASTSET[key] || new Set(), LV = templates.lv || '';

/* v12 (item 110): Stuck? gives up to 2 hints; the score dot shows a hint was used */

/* ---- v18 (item 174): Learn and Check progress are saved, so a lab opens where you left off ---- */
const SAVED = (() => { const p = store('prog') || {}; return {learn:p.learn || {}, check:p.check || {}}; })();

  for(const id in LRN) if(LRN[id] && LRN[id].ph === 'done') delete out.learn[id];

/* ===================== v7: Learn = predict, observe, explain ===================== */

  L.sc[L.i] = has || !!st.num; L.res[L.i] = right ? 'y' : 'n';

  const why = has && !right && pq.w && pq.w[L.pick] ? `<span class="pwhy">${lstr(pq.w[L.pick], app.sim, L)}</span>` : '';
  const ansLine = has ? `<span class="pans">${right ? 'You said' : 'The answer is'}: <b>${ans}</b></span>` : L.near ? `<span class="pans">You typed <b>${fmt(L.nearV)}</b>. The exact answer is <b>${fmt(st.num.v)}</b>.</span>` : '';

function renderLearn(){

/* v19 (item 187): a small results table sits beside the answers, so both fit */

  info(){ const n = this.cardNow();
    const C9 = [
      [LDGU.smoke, '<p>A smoke alarm has a small <b>alpha</b> source. Alpha <b>ionises</b> the air between two plates, so a small current flows.</p><p>Smoke absorbs the alpha, so the current drops and the alarm sounds. Alpha cannot get out of the alarm. The source (americium-241) has a long half-life, about 430 years, so it lasts.</p>', 'Try <b>β</b> and <b>γ</b> in the alarm, then press <b>Add smoke</b>.'],
      [LDGU.gauge, '<p>Factories check the thickness of <b>paper</b> with <b>beta</b>. Some beta gets through. If the paper gets thicker, less gets through, so the count rate falls and the rollers are adjusted.</p><p>Alpha would be stopped completely. Gamma would hardly change.</p>', 'Choose <b>β</b>, then try <b>Thin</b> and <b>Thick</b> paper.'],
      [LDGU.tracer, '<p>A <b>tracer</b> is put inside the body. A <b>gamma camera</b> outside shows where it goes, for example to find a blockage.</p><p>It gives out <b>gamma</b>, which gets out of the body and is the least ionising. It has a <b>short half-life</b> (hours), so it does not stay radioactive in the body.</p>', 'Try each type, then each half-life.'],
      [LDGU.apple, '<p><b>Irradiation</b>: an object is exposed to radiation from outside. It does <b>not</b> become radioactive.</p><p><b>Contamination</b>: radioactive atoms get onto or into the object. It keeps giving out radiation until they decay or are cleaned off.</p>', 'Irradiate the apple, then contaminate a fresh one. Watch the count rate.'],
      [LDGU.steril, '<p><b>Gamma</b> is used to kill bacteria on food and on medical equipment, such as syringes. It goes through the sealed packet, so the equipment stays sterile.</p><p>They are only <b>irradiated</b>, so they do not become radioactive and are safe to use.</p>', 'Irradiate the apple and watch the bacteria.'],

  draw(){

    ctx.fillStyle = '#4a565d'; rr(c.x-4, c.y-30, c.w+8, 22, 6); ctx.fill();

    txt(this.mod ? 'Moderator: graphite' : 'Moderator: removed', c.x + c.w - 4, c.y-19, {size:12, w:700, color: this.mod ? '#e3ecef' : C.orange, align:'right'});
    rr(c.x, c.y, c.w, c.h, 4); ctx.fillStyle = this.mod ? '#262b2f' : '#0b1418'; ctx.fill();
    // the core glows orange, then white, as it overheats
    const hk = clamp((this.temp - 700)/(MELT - 700), 0, 1); if(hk > 0){ ctx.save(); rr(c.x, c.y, c.w, c.h, 4); ctx.clip(); const r0 = 230 + 25*hk, g0 = Math.round(110 + 140*hk*hk), b0 = Math.round(20 + 200*hk*hk*hk); ctx.fillStyle = `rgba(${r0},${g0},${b0},${.15 + .55*hk})`; ctx.fillRect(c.x, c.y, c.w, c.h); ctx.restore(); }
    if(this.mod){ ctx.save(); rr(c.x, c.y, c.w, c.h, 4); ctx.clip(); ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1; ctx.beginPath();
      for(let x=c.x; x<c.x+c.w; x+=F.sx*kx/2){ ctx.moveTo(x,c.y); ctx.lineTo(x,c.y+c.h); } for(let y=c.y; y<c.y+c.h; y+=F.sy*ky/2){ ctx.moveTo(c.x,y); ctx.lineTo(c.x+c.w,y); } ctx.stroke(); ctx.restore(); }
    // glow that grows with the fission rate
    if(rate > 0){ ctx.save(); rr(c.x, c.y, c.w, c.h, 4); ctx.clip(); const g = ctx.createRadialGradient(c.x + c.w/2, c.y + c.h/2, 10, c.x + c.w/2, c.y + c.h/2, Math.max(c.w, c.h)*.7); const a = Math.min(.35, rate/150);

    for(const rx0 of F.rods){ const rx = P(rx0); const g = ctx.createLinearGradient(rx-7,0,rx+7,0); g.addColorStop(0,'#5d666d'); g.addColorStop(.5,'#9aa5ab'); g.addColorStop(1,'#4a5257'); ctx.fillStyle = g; ctx.fillRect(rx-6, c.y - 8, 12, rodB - c.y + 8); ctx.fillStyle = '#2f363a'; ctx.fillRect(rx-6, rodB-4, 12, 4); }
    ctx.fillStyle = this.drag ? C.yellow : 'rgba(207,224,230,.55)'; rr(c.x + 4, rodB - 2, c.w - 8, 3, 1.5); ctx.fill();
    const hx = c.x + c.w - 70; rr(hx, rodB - 11, 62, 22, 8); ctx.fillStyle = this.drag ? C.yellow : '#cfe0e6'; ctx.fill(); txt(`${this.rods}% ↕`, hx + 31, rodB, {size:12, w:800, color:'#0c171e', align:'center'});

    if(this.wasteN && !this.melt && !this.capped && this.scram <= 0) pill('Daughter nuclei (ringed) are radioactive: nuclear waste', c.x + c.w/2, c.y + c.h - 16, {align:'center', size:12, bar:C.purple});
    if(!this.safety && this.temp > HOT && !this.melt && Math.floor(performance.now()/300) % 2 === 0){ rr(c.x + c.w/2 - 170, c.y + c.h/2 - 24, 340, 48, 10); ctx.fillStyle = 'rgba(213,94,0,.92)'; ctx.fill(); txt('DANGER: core overheating!', c.x + c.w/2, c.y + c.h/2, {size:17, w:800, color:'#fff', align:'center'}); }
    if(this.melt) this.drawMelt(c);
    this.legend(c); this.deskDraw(c, bench); ctx.restore(); this.drawFocus(c, bench);
  },
  drawMelt(c){ const t = this.melt.t;
    // cracks in the casing and debris
    ctx.save(); ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3; let sd = 7; const rnd = () => (sd = (sd*16807) % 2147483647)/2147483647;
    for(let k=0;k<9;k++){ let x = c.x - 12 + rnd()*(c.w + 24), y = rnd() < .5 ? c.y - 36 : c.y + c.h + 12; ctx.beginPath(); ctx.moveTo(x, y); for(let j=0;j<4;j++){ x += (rnd() - .5)*40; y += (y < c.y ? 1 : -1)*rnd()*26; ctx.lineTo(x, y); } ctx.stroke(); }
    ctx.restore();
    if(t < 3) for(let k=0;k<26;k++){ const an = k/26*Math.PI*2 + k, d = t*(160 + (k%5)*60), x = c.x + c.w/2 + Math.cos(an)*d, y = c.y + c.h/2 + Math.sin(an)*d*.6 + t*t*60; ctx.fillStyle = k%3 ? '#8d918c' : '#5d666d'; ctx.fillRect(x, y, 8, 6); }
    // steam
    for(let k=0;k<6;k++){ const sx = c.x + c.w*(.15 + k*.14), sy = c.y - 40 - ((t*40 + k*37) % 120); ctx.fillStyle = `rgba(230,236,240,${.25*Math.max(0, 1 - ((t*40 + k*37) % 120)/120)})`; ctx.beginPath(); ctx.arc(sx, sy, 22 + k*2, 0, 7); ctx.fill(); }
    if(t < 1.2){ ctx.fillStyle = `rgba(255,250,235,${(1 - t/1.2)*.95})`; ctx.fillRect(0, 0, W, H); }
    if(t > .5){ const k = Math.min(1, (t - .5)/.25), sc = 1.8 - .8*k; ctx.save(); ctx.translate(c.x + c.w/2, c.y + c.h/2); ctx.rotate(-.12); ctx.scale(sc, sc); ctx.globalAlpha = k;
      rr(-180, -40, 360, 80, 10); ctx.fillStyle = 'rgba(213,94,0,.92)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); txt('MELTDOWN', 0, 2, {size:50, w:900, color:'#fff', align:'center'}); ctx.restore(); }
    if(t > 1.2) pill('A reactor cannot explode like a nuclear bomb, but an overheated core can melt and burst its casing.', c.x + c.w/2, c.y + c.h - 18, {align:'center', size:12.5, bar:C.verm});

  deskDraw(c, bench){ const D = this.desk(), cb = document.querySelector('#ovctl [data-box="ctl"]'), y0 = 12 + (cb ? cb.offsetHeight : 150) + 10, x = D.x, w = D.w;

function gauss(){ let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

  txt('Hydrogen nuclei', x - 120, cy + 50, {size:15, color:C.muted, align:'center'}); txt('Helium', x + 90, cy + 50, {size:15, color:C.muted, align:'center'}); }

  txt('Before', b1 + bw/2, by + bh + 24, {size:16, w:700, align:'center'}); txt('After', b2 + bw/2, by + bh + 24, {size:16, w:700, align:'center'}); txt('(not to scale)', r.x + r.w/2, by + bh + 50, {size:13, color:C.muted, align:'center'}); }
